<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOM 01 · 教室 | JACK'S ESCAPE ROOM</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>.veil{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#06050e}</style>
</head>
<body data-base="">

<div class="bg-wrap"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="stars"></canvas>
<div class="grain"></div><div class="vignette"></div><div class="cursor-glow"></div>

<div class="veil" id="veil"><div class="veil-inner"><div class="veil-ring"></div><div class="veil-text">LOADING</div><div class="veil-sub">ROOM 01 · CLASSROOM</div></div></div>

<header class="topbar">
  <div class="brand"><div class="mark">🔐</div><div><b>JACK'S ESCAPE ROOM</b><span>密室逃脱 · 校园版</span></div></div>
  <div class="progress"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="progress-label" id="progressLabel">ROOM 01 / 06</div></div>
  <div class="tools"><button class="icon-btn" id="soundBtn" title="音效开关">🔊</button><button class="icon-btn" data-nav="index.html" data-nav-label="返回首页" title="返回首页">⌂</button></div>
</header>

<main class="wrap stage">
  <div class="room-head">
    <div class="crumb"><a data-nav="index.html" data-nav-label="返回首页">首页</a><span class="sep">/</span><span>ROOM 01 · CLASSROOM</span></div>
    <div class="room-title"><h2 id="roomName">教室</h2><span class="en" id="roomEn">CLASSROOM</span></div>
  </div>

  <div class="room-grid">
    <div class="scene">
      <img src="assets/img/room1.jpg" alt="高三(2)班教室">
      <div class="scan"></div><div class="glowline"></div>
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="scene-tag" id="sceneTag">ROOM 01</div>
      <div class="scene-cap"><div class="k">地点</div><div class="v">▲ 高三(2)班 · Jack 的座位</div></div>
    </div>

    <div class="panel">
      <div class="block">
        <div class="block-h"><span class="n">1</span>现场</div>
        <div class="story" id="story"></div>
      </div>

      <div class="block reveal hidden" id="clueBlock">
        <div class="block-h"><span class="n">2</span>线索</div>
        <div class="clue" id="clueBody"></div>
      </div>

      <div class="block reveal hidden" id="puzzleBlock">
        <div class="block-h"><span class="n">3</span><span id="puzzleLabel">抽屉密码锁</span></div>
        <div class="puzzle">
          <div class="code-row" id="codeRow"></div>
          <div class="puzzle-actions">
            <button class="btn primary" id="checkBtn"><span class="ic">🔓</span> 开锁</button>
            <button class="btn ghost" id="hintBtn"><span class="ic">💡</span> 提示</button>
          </div>
          <div class="feedback" id="feedback"></div>
          <div class="hint-box hidden" id="hintBox"></div>
        </div>
      </div>

      <div class="block reveal hidden" id="solvedBlock">
        <div class="solved-banner"><div class="ok-ic">✓</div><div><b>「咔哒」——抽屉开了</b><span>里面是通往下一间的钥匙。</span></div></div>
      </div>

      <div class="block reveal hidden" id="choiceBlock">
        <div class="block-h"><span class="n">?</span>抉择</div>
        <div class="choice-q" id="choiceQ"></div>
        <div class="choice-list" id="choiceList"></div>
        <div class="choice-note hidden" id="choiceNote"></div>
      </div>

      <div class="block reveal hidden" id="continueBlock">
        <div class="puzzle-actions">
          <button class="btn cyan lg" id="continueBtn"><span id="continueLabel">前往下一间</span><span class="ic">→</span></button>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">JACK'S ESCAPE ROOM · ROOM 01 / 06</footer>
</main>

<script>
window.ROOM = {
  id: 1, name: '教室', en: 'CLASSROOM', tag: 'ROOM 01',
  intro: [
    '你在教室里醒来。头有点疼，门被从外面反锁了。',
    '唯一的亮光来自 Jack 的课桌——那盏小台灯还开着，像是在特意等你。',
    '黑板旁边的墙上，贴着一张便签，字歪歪扭扭，一看就是[b]右手写的[/b]——[j]毕竟他左手刚从单杠上飞出去[/j]。'
  ],
  clueTitle: '黑板旁的便签',
  clueHtml: '便签上写着：<br>「兄弟们，我左手断了，只能用右手写字，所以我把密码写得很简单——<b>我骨折的那一天，月 + 日（共四位）</b>。那天我在单杠上完成了人生第一次前空翻，<b>差一点</b>。」<br><br>旁边的班级日历上，<span class="pin">3 月 15 日</span>被红笔重重圈着，旁边一行小字：<span class="num">体育节 · Jack 的滑铁卢</span>。',
  puzzle: {
    length: 4, answer: '0315', accepts: ['315', '3.15'], label: '课桌抽屉密码锁',
    hint: '就是日历上被红笔圈住的那一天——月份补成两位数字再连上日期。', placeholder: '四位数字'
  },
  choice: {
    q: '抽屉里还躺着一支马克笔，笔帽上写着「Jack 的石膏签名专用」。你打算怎么处理它？',
    options: [
      { label: '收进兜里，出去还给他', bro: 1, note: '你把马克笔收好了。Jack 会记得这份人情。（仗义值 +1）' },
      { label: '随手扔进废纸篓', bro: 0, note: '马克笔「啪」地掉进纸篓。以后他大概只能用水笔签名了。（仗义值 +0）' }
    ]
  },
  next: 'room2.html', nextLabel: '前往 ROOM 02 · 化学实验室', nextEn: 'ROOM 02'
};
</script>
<script src="assets/js/game.js"></script>
</body>
</html>
